name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw version string: $RAW_VERSION"

          MAJOR_VERSION=$(echo "$RAW_VERSION" | sed -E 's/^1\.//; s/[^0-9].*//')
          echo "Detected Java major version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ]; then
            echo "ERROR: Failed to detect Java major version."
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "ERROR: Java 17 or newer is required, but detected version is $MAJOR_VERSION."
            exit 1
          fi

          echo "Java version validation passed: Java $MAJOR_VERSION is >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore is missing; generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
            echo "Generated ./debug.keystore successfully."
          fi

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected APK missing at $EXPECTED_APK, searching in app/build/outputs/apk..."
            FOUND_APK=$(find app/build/outputs/apk -type f -name "app-debug.apk" | head -n 1)
            if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then
              echo "Found debug APK at $FOUND_APK. Copying to $EXPECTED_APK"
              mkdir -p "$(dirname "$EXPECTED_APK")"
              cp "$FOUND_APK" "$EXPECTED_APK"
            else
              echo "ERROR: app-debug.apk not found in app/build/outputs/apk."
              exit 1
            fi
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not end in .apk"
              exit 1
              ;;
          esac

          echo "APK verified successfully: $EXPECTED_APK ($(stat -c %s "$EXPECTED_APK") bytes)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_TITLE: Debug APK Build #${{ github.run_number }}
          TARGET_COMMIT: ${{ github.sha }}
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          echo "Verifying GitHub CLI availability..."
          if ! command -v gh >/dev/null 2>&1; then
            echo "ERROR: GitHub CLI (gh) is not installed or available in PATH."
            exit 1
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH is missing. Cannot proceed with release."
            exit 1
          fi

          echo "Preparing release asset app-debug.apk..."
          cp "$APK_PATH" ./app-debug.apk

          echo "Creating GitHub release '$TAG_NAME' targeting '$TARGET_COMMIT'..."
          if gh release create "$TAG_NAME" \
            ./app-debug.apk \
            --target "$TARGET_COMMIT" \
            --title "$RELEASE_TITLE" \
            --notes "Automated Debug APK build from commit $TARGET_COMMIT. Permanent direct download link: https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk" \
            --latest; then
            echo "Release created and marked as latest successfully!"
            echo "Permanent direct download URL:"
            echo "https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          else
            echo "ERROR: Failed to create GitHub release."
            echo "Note: The backup artifact 'app-debug-apk' was uploaded successfully and remains available in this run."
            exit 1
          fi
